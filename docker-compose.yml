services:
  postgres:
    image: postgres:17-alpine
    container_name: cdq-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cdq
    ports:
      - "5432:5432"
    volumes:
      - cdq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cdq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cdq_pgdata:
