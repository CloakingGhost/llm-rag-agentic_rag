services:
  postgres:
    image: postgres:17-alpine
    container_name: cdq-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cdq
    ports:
      - "5432:5432"
    volumes:
      - cdq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cdq"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API는 docker-compose 밖, 호스트에서 `uv run uvicorn ... --port 8100`으로 띄운다
  # (README.md). 그래서 Prometheus는 컨테이너 안에서 호스트를 가리켜야 스크레이프된다
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: cdq-prometheus
    # 기본 인자 + k6 결과 수신(remote write). 배포 환경 부하테스트는 API의 /metrics를 긁을 수 없어서
    # k6가 측정한 클라이언트 쪽 지표를 여기로 받아 Grafana에서 본다 (load/k6/run.sh의 K6_PROM_RW=1)
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - cdq_prom_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux Docker Desktop 호환용. Windows/Mac은 기본 제공

  grafana:
    image: grafana/grafana:11.4.0
    container_name: cdq-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # 기본값 방치 금지(IMP-10과 같은 문제 반복 안 함). 루트 .env에서 설정한다
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD를 .env에 설정하세요 (.env.example 참고)}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - cdq_grafana_data:/var/lib/grafana
    ports:
      - "3300:3000"
    depends_on:
      - prometheus

volumes:
  cdq_pgdata:
  cdq_prom_data:
  cdq_grafana_data:
