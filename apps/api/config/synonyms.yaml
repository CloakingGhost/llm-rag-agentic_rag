# 일상어 → 소비자분쟁해결기준 용어
# 고시는 '퍼스널컴퓨터', '이동전화서비스'처럼 예전 표기를 쓴다.
# 사용자는 '노트북', '휴대폰'이라고 쓰므로 검색 질의를 넓힐 때 이 표를 함께 본다.
# 규정 내용을 바꾸는 것이 아니라 찾아가는 길만 이어 준다.

노트북: 퍼스널컴퓨터 전자제품 사무용기기
노트북컴퓨터: 퍼스널컴퓨터 전자제품 사무용기기
랩탑: 퍼스널컴퓨터 전자제품 사무용기기
데스크탑: 퍼스널컴퓨터 전자제품 사무용기기
피시: 퍼스널컴퓨터 전자제품 사무용기기
모니터: 퍼스널컴퓨터 및 컴퓨터 주변기기
프린터: 컴퓨터 주변기기 사무용기기
휴대폰: 스마트폰 이동전화서비스
핸드폰: 스마트폰 이동전화서비스
아이폰: 스마트폰
갤럭시: 스마트폰
태블릿: 퍼스널컴퓨터 및 컴퓨터 주변기기
