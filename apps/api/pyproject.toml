[project]
name = "cdq-api"
version = "0.1.0"
description = "소비자 분쟁 Q&A 챗봇 백엔드 (Vanilla / Native RAG / Agentic RAG)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "orjson>=3.12",
    "pyyaml>=6.0",
    "typer>=0.27",
    "httpx>=0.28",
    "tenacity>=9.1",
    "pdfplumber>=0.11",
    "networkx>=3.6",
    "chromadb>=1.5",
    "openai>=3.16",
    "langgraph>=1.2",
    "langchain-openai>=1.6",
    "sqlalchemy>=2.0",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pandas>=3.0.6",
]

[project.scripts]
kb = "cli.kb:app"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli", "kb_build"]
